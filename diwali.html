<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Up Diwali</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="fireworks" id="fireworks"></div>

    <main class="card" id="card">
        <div class="card-border"></div>

        <div class="top-label">✦ THE FESTIVAL OF LIGHTS ✦</div>

        <div class="heading">
            <p>Let's make this night</p>
            <h1>MAGICAL<span>.</span></h1>
        </div>

        <div class="diya-area">
            <div class="glow" id="glow"></div>

            <div class="diya" id="diya">
                <div class="flame" id="flame">
                    <span></span>
                </div>
                <div class="diya-bowl"></div>
                <div class="diya-base"></div>
            </div>
        </div>

        <div class="instruction" id="instruction">
            Your little light is waiting...
        </div>

        <button class="match-button" id="lightBtn">
            <span>✦</span> Light the diya
        </button>

        <section class="celebration hidden" id="celebration">
            <h2>HAPPY <span>DIWALI</span></h2>
            <p>Let the celebrations begin!</p>

            <button class="firework-button" id="fireBtn">
                🎆 Celebrate Diwali
            </button>

            <button class="wish-button" id="wishBtn">
                Open your wish ✨
            </button>
        </section>

        <div class="wish-message hidden" id="wishMessage">
            <span class="wish-star">✦</span>
            <p id="wishText">
                May your life shine with happiness and love.
            </p>
            <button id="closeWish">Close</button>
        </div>

        
    </main>

    <script src="temp.js"></script>
</body>
</html>
